<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pregleden prikaz Jupyter zvezkov z iskanjem in kazalom." />
  <title>Zvezek — Python priročnik</title>
  <link rel="stylesheet" href="notebook.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="notebook.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <a class="home-link" href="index.html">Python priročnik</a>
      <span class="crumb">/</span>
      <a class="books-link" href="zvezki.html">Zvezki</a>
    </div>

    <nav class="notebook-tabs" id="notebook-tabs" aria-label="Izbira zvezka"></nav>

    <div class="top-actions">
      <button id="toggle-code" type="button">Skrij kodo</button>
      <button id="scroll-top" type="button">↑ Na vrh</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="toc-panel">
      <div class="notebook-label">ZVEZEK</div>
      <h1 class="sidebar-title" id="notebook-name">Zvezek</h1>
      <p class="sidebar-description" id="notebook-description"></p>

      <label class="search-label" for="notebook-search">Išči po zvezku</label>
      <div class="search-box">
        <input id="notebook-search" type="search" placeholder="npr. split, NumPy, slovar ..." autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </div>
      <div id="search-status" class="search-status">Prikazane so vse celice.</div>

      <div class="toc-heading-row">
        <div class="toc-title">KAZALO</div>
        <span id="toc-count"></span>
      </div>
      <nav id="toc" aria-label="Kazalo zvezka"></nav>

      <div class="toc-footer">
        Klik na naslov skoči neposredno na poglavje. Kazalo zazna tudi glavne naslove, ki niso zapisani z znakom <code>#</code>.
      </div>
    </aside>

    <main class="notebook-shell">
      <div id="loading" class="status-card">Nalagam zvezek ...</div>
      <div id="error" class="status-card error" hidden></div>

      <section id="quick-jumps" class="quick-jumps" hidden>
        <div class="quick-jumps-heading">
          <div>
            <div class="quick-jumps-eyebrow">KAZALO ZVEZKA</div>
            <h2 id="quick-jumps-title">Hitri skoki</h2>
          </div>
          <p id="quick-jumps-description"></p>
        </div>
        <nav id="quick-jumps-list" class="quick-jumps-list" aria-label="Hitri skoki po zvezku"></nav>
      </section>

      <article id="notebook" class="notebook" hidden></article>
    </main>
  </div>
</body>
</html>
